name: "Copilot Setup Steps"

# Setup the environment for Copilot agents to run in
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Needed to clone the repository
    permissions:
      contents: read

    # Install dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            asciidoctor \
            build-essential \
            cmake \
            libbotan-3-dev \
            libkeyutils-dev \
            libminizip-dev \
            libpcsclite-dev \
            libqrencode-dev \
            libreadline-dev \
            libusb-1.0-0-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxtst-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-l10n-tools \
            qt6-tools-dev \
            qt6-svg-dev \
            zlib1g-dev
